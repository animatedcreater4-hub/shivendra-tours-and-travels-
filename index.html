<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shivendra Tours and Travels</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #073b74;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 5px;
      color: #ffd166;
    }

    nav {
      background: #052b55;
      padding: 12px 5px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
      font-size: 14px;
    }

    .hero {
      background: linear-gradient(135deg, #073b74, #168aad);
      color: white;
      padding: 55px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 29px;
      margin-bottom: 12px;
    }

    .hero p {
      margin-bottom: 22px;
    }

    .btn {
      display: inline-block;
      background: #ffd166;
      color: #17324d;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    section {
      padding: 30px 16px;
    }

    .title {
      text-align: center;
      color: #073b74;
      margin-bottom: 22px;
      font-size: 24px;
    }

    .card {
      background: white;
      padding: 22px;
      margin: 15px auto;
      max-width: 500px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #00000012;
    }

    .card h3 {
      color: #073b74;
      margin-bottom: 10px;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .feature {
      background: white;
      padding: 18px 10px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 10px #00000010;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      border: 1px solid #ccd5e0;
      border-radius: 7px;
      font-size: 16px;
    }

    label {
      font-weight: bold;
    }

    form .btn {
      width: 100%;
      font-size: 16px;
    }

    .contact {
      text-align: center;
      background: #e6f2ff;
      border-radius: 12px;
      padding: 22px;
    }

    footer {
      background: #052b55;
      color: white;
      text-align: center;
      padding: 20px 12px;
      font-size: 14px;
    }

    @media (min-width: 700px) {
      .features {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚌 Shivendra Tours and Travels</h1>
    <p>आपका सफर, हमारी जिम्मेदारी ❤️</p>
  </header>

  <nav>
    <a href="#home">होम</a>
    <a href="#tours">यात्राएँ
